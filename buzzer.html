<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Family Feud - Player Buzzer</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/buzzer.css">
  <!-- PeerJS for WebRTC Multiplayer Buzzers -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body class="buzzer-body">
  <div class="buzzer-container">
    <!-- View 1: Join / Setup Screen -->
    <div id="joinView" style="display:flex;flex:1;align-items:center;justify-content:center;">
      <div class="buzzer-join-card">
        <h2 style="font-family:var(--font-display);font-size:2rem;font-weight:900;color:var(--gold-primary);text-align:center;letter-spacing:1px;margin-bottom:6px;">
          ★ PLAYER BUZZER ★
        </h2>
        <p style="text-align:center;font-size:0.9rem;color:var(--text-muted);margin-bottom:20px;">
          Connect to live Family Feud game show
        </p>

        <div class="form-group">
          <label class="form-label">Your Name / Nickname:</label>
          <input type="text" id="playerNameInput" class="form-input" placeholder="e.g. Alex" maxlength="20">
        </div>

        <div class="form-group">
          <label class="form-label">Choose Your Team:</label>
          <div class="team-choice-grid">
            <button type="button" id="team1ChoiceBtn" class="team-choice-btn selected-team1">
              Team 1
            </button>
            <button type="button" id="team2ChoiceBtn" class="team-choice-btn">
              Team 2
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Game Room Code:</label>
          <input type="text" id="roomCodeInput" class="form-input" style="text-transform:uppercase;font-weight:800;letter-spacing:1.5px;" value="FEUD">
        </div>

        <button type="button" id="joinGameBtn" class="btn-primary" style="width:100%;margin-top:10px;padding:14px;font-size:1.15rem;">
          JOIN BUZZER ROOM ➔
        </button>
      </div>
    </div>

    <!-- View 2: Active Buzzer Screen -->
    <div id="buzzerView" style="display:none;flex-direction:column;flex:1;">
      <!-- Player HUD Top Bar -->
      <div class="buzzer-hud">
        <div class="player-identity-box">
          <span class="player-identity-name" id="playerDisplayName">Alex</span>
          <span class="player-identity-team" id="playerDisplayTeam">Team 1</span>
        </div>

        <div class="scores-quick-bar">
          <span id="currentRoundTag" class="badge badge-gold">Round 1</span>
          <span id="clientStatusBadge" class="badge badge-green">Connected</span>
        </div>
      </div>

      <!-- Live Scores Header -->
      <div style="display:flex;justify-content:space-around;background:rgba(0,0,0,0.35);padding:10px;border-radius:var(--radius-sm);margin-bottom:12px;font-size:0.95rem;font-weight:800;font-family:var(--font-display);">
        <span id="team1HudScore" style="color:#2ecc71;">Team 1: 0</span>
        <span style="color:var(--text-muted);">|</span>
        <span id="team2HudScore" style="color:#ff7675;">Team 2: 0</span>
      </div>

      <!-- Giant Interactive Buzzer Button -->
      <div class="buzzer-arena">
        <div class="buzzer-button-wrapper">
          <div class="buzzer-base-ring"></div>
          <button id="giantBuzzerBtn" class="giant-buzzer-btn locked" disabled>
            BUZZ!
          </button>
        </div>

        <div class="buzzer-status-text" id="buzzerStatusText">
          Waiting for host to arm buzzers...
        </div>
      </div>

      <!-- Bottom Rules Cheat-Sheet -->
      <div class="rules-footer-bar">
        ⚡ <strong>Face-Off:</strong> Faster player answers first.<br>
        ⏱️ <strong>Board Play:</strong> 20s per guess. No hints from teammates!<br>
        🚨 <strong>Steal:</strong> 15s group conferral after 3 strikes.
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/sound.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/buzzer.js"></script>
</body>
</html>
